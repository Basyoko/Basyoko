<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360"><defs><radialGradient id="bg" cx="50%" cy="40%" r="80%"><stop offset="0" stop-color="#1b0a0a"/><stop offset="1" stop-color="#050505"/></radialGradient><filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse"><rect width="4" height="1" fill="#fff" opacity=".05"/></pattern></defs><rect x="1" y="1" width="478" height="358" rx="14" fill="url(#bg)" stroke="#c1121f" stroke-opacity=".7" stroke-width="2"/><rect x="14" y="14" width="452" height="332" fill="url(#scan)"/><path d="M20,44 V20 H44" fill="none" stroke="#c1121f" stroke-width="2"/><path d="M436,20 H460 V44" fill="none" stroke="#c1121f" stroke-width="2"/><path d="M20,316 V340 H44" fill="none" stroke="#c1121f" stroke-width="2"/><path d="M436,340 H460 V316" fill="none" stroke="#c1121f" stroke-width="2"/><circle cx="34" cy="34" r="4" fill="#c1121f" filter="url(#glow)"><animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/></circle><text x="46" y="38" font-family="'Courier New',Courier,monospace" font-size="12" fill="#c1121f" letter-spacing="2">REC ● TERMINAL-01</text><text x="446" y="38" font-family="'Courier New',Courier,monospace" font-size="11" fill="#7a7a7a" text-anchor="end">CAM-██ // SITE-██</text><rect x="16" y="44" width="448" height="14" fill="#c1121f" opacity=".07"><animate attributeName="y" values="44;290;44" dur="6s" repeatCount="indefinite"/></rect><rect x="40" y="62" width="400" height="214" rx="8" fill="#050505" stroke="#c1121f" stroke-opacity=".6"/><rect x="40" y="62" width="400" height="22" rx="8" fill="#1a0505"/><text x="52" y="78" font-family="'Courier New',Courier,monospace" font-size="11" fill="#7a7a7a">● ● ●   bot.js — sujet actif</text><text x="54" y="104" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e8e8e8" opacity="0">&gt; node bot.js<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.050;0.070;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="123" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e8e8e8" opacity="0">[OK] connexion au serveur Discord<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.128;0.148;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="142" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e8e8e8" opacity="0">[OK] commandes chargées : ██<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.206;0.226;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="161" font-family="'Courier New',Courier,monospace" font-size="12" fill="#c1121f" opacity="0">client.on('message', msg =&gt; {<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.283;0.303;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="180" font-family="'Courier New',Courier,monospace" font-size="12" fill="#7a7a7a" opacity="0">   if (msg.content === '!ping')<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.361;0.381;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="199" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e8e8e8" opacity="0">      msg.reply('███████');<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.439;0.459;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="218" font-family="'Courier New',Courier,monospace" font-size="12" fill="#c1121f" opacity="0">});<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.517;0.537;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="237" font-family="'Courier New',Courier,monospace" font-size="12" fill="#c1121f" opacity="0">[ALERTE] comportement █████ détecté<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.594;0.614;0.94;1" dur="9s" repeatCount="indefinite"/></text><text x="54" y="256" font-family="'Courier New',Courier,monospace" font-size="12" fill="#e8e8e8" opacity="0">&gt; _<animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.672;0.692;0.94;1" dur="9s" repeatCount="indefinite"/></text><rect x="388" y="214" width="42" height="42" rx="4" fill="#f7df1e" opacity=".92"/><text x="426" y="251" font-family="'Courier New',Courier,monospace" font-size="22" font-weight="700" text-anchor="end" fill="#111">JS</text><rect x="66" y="250" width="8" height="2" fill="#e8e8e8"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect><rect x="250" y="136" width="60" height="12" fill="#000"><animate attributeName="width" values="0;60;60;0" keyTimes="0;.3;.8;1" dur="9s" repeatCount="indefinite"/></rect><text x="240.0" y="296" font-family="'Courier New',Courier,monospace" font-size="10" text-anchor="middle" fill="#7a7a7a" letter-spacing="2">CLASSE D'OBJET : EUCLIDE  •  CONFINEMENT : ACTIF</text><text x="240.0" y="326" font-family="'Courier New',Courier,monospace" font-size="24" font-weight="700" text-anchor="middle" fill="#fff" letter-spacing="4" filter="url(#glow)">BOT-DISCORD</text><text x="240.0" y="346" font-family="'Courier New',Courier,monospace" font-size="11" text-anchor="middle" fill="#c1121f" letter-spacing="3">BOT DISCORD  •  JAVASCRIPT</text></svg>